name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6.0"
      - run: ruff check . --output-format=github

  test:
    name: Unit tests + offline eval (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      # Deterministic suite: no API keys, no network. The 5 retrieval tests
      # skip here (no index) and run in the `rag` job below.
      - name: Run tests with coverage
        run: >
          python -m pytest -q
          --cov=graph --cov=evals --cov=rag
          --cov-report=term --cov-report=xml
          --junitxml=test-results.xml

      # Golden set: checks all 14 hand-labelled plans against the rule engine.
      - name: Critic golden-set eval (offline)
        run: python -m evals.run_eval --offline

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml

  rag:
    name: Build FAISS index + retrieval tests
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      # The ~130 MB embedding model downloads once, then comes from cache.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-base-en-v1.5

      # Rebuild the index only when the papers or the ingest code change.
      - name: Cache FAISS index
        id: index-cache
        uses: actions/cache@v4
        with:
          path: rag/faiss_index
          key: faiss-${{ hashFiles('rag/knowledge_base/**', 'rag/ingest.py', 'rag/embeddings.py') }}

      - name: Build FAISS index
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: python -m rag.ingest

      - name: Retrieval tests
        run: python -m pytest -q tests/test_rag_retriever.py
